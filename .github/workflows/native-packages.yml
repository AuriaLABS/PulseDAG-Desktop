name: Native packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/fetch-v2-4-release.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/native-packages.yml"
      - ".github/workflows/v2-4-release-validation.yml"
      - "package.json"
      - "src/**"
      - "src-tauri/**"
  push:
    branches: [main]
    paths:
      - ".github/scripts/fetch-v2-4-release.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/native-packages.yml"
      - ".github/workflows/v2-4-release-validation.yml"
      - "package.json"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
            node_asset: pulsedagd-v2.4.0-x86_64-unknown-linux-gnu.tar.gz
            miner_asset: pulsedag-miner-v2.4.0-x86_64-unknown-linux-gnu.tar.gz
            bundles: deb,appimage
            artifact: pulsedag-desktop-linux-x86_64-unsigned
          - label: Windows x86_64
            os: windows-2022
            node_asset: pulsedagd-v2.4.0-x86_64-pc-windows-msvc.zip
            miner_asset: pulsedag-miner-v2.4.0-x86_64-pc-windows-msvc.zip
            bundles: nsis,msi
            artifact: pulsedag-desktop-windows-x86_64-unsigned
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate platform icons
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Verify and download final v2.4 node release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/fetch-v2-4-release.mjs
          --asset "${{ matrix.node_asset }}"
          --output "${{ runner.temp }}/pulsedag-v24-node"

      - name: Verify and download final v2.4 miner release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/fetch-v2-4-release.mjs
          --asset "${{ matrix.miner_asset }}"
          --output "${{ runner.temp }}/pulsedag-v24-miner"

      - name: Extract final Linux node and miner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node_extract="$RUNNER_TEMP/pulsedag-v24-node/extracted"
          miner_extract="$RUNNER_TEMP/pulsedag-v24-miner/extracted"
          mkdir -p "$node_extract" "$miner_extract"
          tar -xzf "$PULSEDAG_V24_NODE_ARCHIVE" -C "$node_extract"
          tar -xzf "$PULSEDAG_V24_MINER_ARCHIVE" -C "$miner_extract"
          node_binary="$node_extract/$PULSEDAG_V24_NODE_ARCHIVE_ROOT/$PULSEDAG_V24_NODE_BINARY_NAME"
          miner_binary="$miner_extract/$PULSEDAG_V24_MINER_ARCHIVE_ROOT/$PULSEDAG_V24_MINER_BINARY_NAME"
          test -f "$node_binary"
          test -f "$miner_binary"
          chmod +x "$node_binary" "$miner_binary"
          echo "PULSEDAG_V24_NODE_BINARY=$node_binary" >> "$GITHUB_ENV"
          echo "PULSEDAG_V24_MINER_BINARY=$miner_binary" >> "$GITHUB_ENV"

      - name: Extract final Windows node and miner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeExtract = Join-Path $env:RUNNER_TEMP "pulsedag-v24-node\extracted"
          $minerExtract = Join-Path $env:RUNNER_TEMP "pulsedag-v24-miner\extracted"
          New-Item -ItemType Directory -Force -Path $nodeExtract | Out-Null
          New-Item -ItemType Directory -Force -Path $minerExtract | Out-Null
          Expand-Archive -LiteralPath $env:PULSEDAG_V24_NODE_ARCHIVE -DestinationPath $nodeExtract
          Expand-Archive -LiteralPath $env:PULSEDAG_V24_MINER_ARCHIVE -DestinationPath $minerExtract
          $nodeBinary = Join-Path $nodeExtract "$env:PULSEDAG_V24_NODE_ARCHIVE_ROOT\$env:PULSEDAG_V24_NODE_BINARY_NAME"
          $minerBinary = Join-Path $minerExtract "$env:PULSEDAG_V24_MINER_ARCHIVE_ROOT\$env:PULSEDAG_V24_MINER_BINARY_NAME"
          if (-not (Test-Path -LiteralPath $nodeBinary -PathType Leaf)) { throw "Missing final pulsedagd binary" }
          if (-not (Test-Path -LiteralPath $minerBinary -PathType Leaf)) { throw "Missing final pulsedag-miner binary" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PULSEDAG_V24_NODE_BINARY=$nodeBinary"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PULSEDAG_V24_MINER_BINARY=$minerBinary"

      - name: Rehearse final v2.4 node provenance
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          v2_4_final_node_release_rehearsal
          -- --ignored --nocapture

      - name: Rehearse final v2.4 miner provenance
        run: >-
          cargo test
          --manifest-path src-tauri/Cargo.toml
          v2_4_final_miner_release_rehearsal
          -- --ignored --nocapture

      - name: Smoke final Linux node and miner without starting a network
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "$PULSEDAG_V24_NODE_BINARY" --version
          "$PULSEDAG_V24_MINER_BINARY" --help >/dev/null

      - name: Smoke final Windows node and miner without starting a network
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PULSEDAG_V24_NODE_BINARY --version
          if ($LASTEXITCODE -ne 0) { throw "pulsedagd --version failed" }
          & $env:PULSEDAG_V24_MINER_BINARY --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "pulsedag-miner --help failed" }

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build unsigned native bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Stage Linux bundles and checksums
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          staging="$GITHUB_WORKSPACE/package-artifacts"
          mkdir -p "$staging"
          find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -exec cp '{}' "$staging/" ';'
          find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -exec cp '{}' "$staging/" ';'
          test "$(find "$staging" -maxdepth 1 -type f | wc -l)" -ge 2
          cp "$PULSEDAG_V24_NODE_EVIDENCE" "$staging/OFFICIAL_NODE_RELEASE_EVIDENCE.json"
          cp "$PULSEDAG_V24_MINER_EVIDENCE" "$staging/OFFICIAL_MINER_RELEASE_EVIDENCE.json"
          (
            cd "$staging"
            sha256sum -- *.deb *.AppImage OFFICIAL_NODE_RELEASE_EVIDENCE.json OFFICIAL_MINER_RELEASE_EVIDENCE.json > SHA256SUMS.txt
          )

      - name: Stage Windows bundles and checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "package-artifacts"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $bundles = @()
          $bundles += Get-ChildItem -Path "src-tauri\target\release\bundle\msi\*.msi" -File
          $bundles += Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" -File
          if ($bundles.Count -lt 2) {
            throw "Expected both MSI and NSIS bundles."
          }
          $bundles | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $staging }
          Copy-Item -LiteralPath $env:PULSEDAG_V24_NODE_EVIDENCE -Destination (Join-Path $staging "OFFICIAL_NODE_RELEASE_EVIDENCE.json")
          Copy-Item -LiteralPath $env:PULSEDAG_V24_MINER_EVIDENCE -Destination (Join-Path $staging "OFFICIAL_MINER_RELEASE_EVIDENCE.json")
          $checksumLines = Get-ChildItem -LiteralPath $staging -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content -LiteralPath (Join-Path $staging "SHA256SUMS.txt") -Value $checksumLines

      - name: Upload unsigned package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package-artifacts
          if-no-files-found: error
          retention-days: 14
